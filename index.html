<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Agent Prep Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- INPUT VIEW CONSOLE -->
    <div id="input-view" class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
            <div class="flex items-center gap-4 mb-8">
                <div class="p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl border border-indigo-500/30">
                    <i data-lucide="cpu" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Agentic Interview Pipeline</h1>
                    <p class="text-sm text-slate-400">Upload your parameters to initiate the multi-agent orchestration.</p>
                </div>
            </div>

            <form id="pipeline-form" class="space-y-6">
                <!-- Resume File Upload -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Resume (PDF format only)</label>
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-700 hover:border-indigo-500/50 bg-slate-950 rounded-2xl cursor-pointer transition-all group">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i data-lucide="file-text" class="w-8 h-8 text-slate-500 group-hover:text-indigo-400 mb-2 transition-colors"></i>
                            <p class="text-sm text-slate-400 font-medium" id="file-label-text">Click to choose or drop your resume PDF</p>
                        </div>
                        <input type="file" id="resume" accept=".pdf" class="hidden" required onchange="updateFileLabel()" />
                    </label>
                </div>

                <!-- Job Description Paste -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Target Job Description</label>
                    <textarea id="job_description" rows="6" class="w-full bg-slate-950 border border-slate-700/80 rounded-2xl p-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-sans text-sm tracking-wide leading-relaxed resize-none" placeholder="Paste the full job description requirements here..." required></textarea>
                </div>

                <!-- Run Trigger -->
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] font-bold text-white py-4 px-6 rounded-2xl tracking-wide shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-5 h-5"></i>
                    <span>Execute Multi-Agent Synthesis</span>
                </button>
            </form>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-view" class="hidden min-h-screen flex flex-col items-center justify-center bg-slate-950 p-6">
        <div class="relative flex items-center justify-center mb-6">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-indigo-500"></div>
            <i data-lucide="bot" class="w-6 h-6 text-indigo-400 absolute"></i>
        </div>
        <h3 class="text-xl font-bold text-white tracking-wide mb-1">Agents at Work</h3>
        <p class="text-slate-400 text-sm max-w-sm text-center animate-pulse">Consulting DuckDuckGo search indexes, mapping skill discrepancies, and structuring schedules...</p>
    </div>

    <!-- DASHBOARD TERMINAL VIEW -->
    <div id="dashboard-view" class="hidden flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                        <i data-lucide="terminal" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight text-white">PrepTerminal</h1>
                        <p class="text-xs text-indigo-400/80 font-mono uppercase tracking-wider">Analysis Complete</p>
                    </div>
                </div>
                <nav class="space-y-1.5" id="tab-menu"></nav>
            </div>
            <div class="p-6 border-t border-slate-800 bg-slate-950/40">
                <button onclick="resetToInput()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-slate-800 text-slate-400 text-sm font-semibold hover:bg-slate-800 hover:text-white transition-all">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Reset Pipeline
                </button>
            </div>
        </aside>

        <!-- MAIN WINDOW -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-950">
            <header class="h-20 border-b border-slate-800/80 px-8 flex items-center justify-between bg-slate-900/40 backdrop-blur-md">
                <h2 id="active-tab-title" class="text-xl font-semibold text-white tracking-tight">Interview Experiences</h2>
                <div class="text-xs text-slate-400 font-mono bg-slate-800/60 px-3 py-1.5 rounded-md border border-slate-700/40">Status: Active Payload</div>
            </header>
            <div class="flex-1 overflow-y-auto p-8" id="content-viewport"></div>
        </main>
    </div>

    <!-- APPLICATION SCRIPTS -->
    <script>
        let payloadData = null;
        let activeTab = 'experiences';

        const config = [
            { id: 'experiences', title: 'Interview Experiences', icon: 'message-square-quote' },
            { id: 'techstack', title: 'Tech Stack Needed', icon: 'layers' },
            { id: 'resources', title: 'Learning Resources', icon: 'bookmark-check' },
            { id: 'timetable', title: 'Study Timetable', icon: 'calendar-range' }
        ];

        function updateFileLabel() {
            const fileInput = document.getElementById('resume');
            const labelText = document.getElementById('file-label-text');
            if (fileInput.files.length > 0) {
                labelText.innerText = `Selected: ${fileInput.files[0].name}`;
                labelText.classList.add('text-indigo-400');
            }
        }

        document.getElementById('pipeline-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resumeFile = document.getElementById('resume').files[0];
            const jdText = document.getElementById('job_description').value;

            // Packing form inputs for multipart/form-data transaction
            const formData = new FormData();
            formData.append('resume', resumeFile);
            formData.append('job_description', jdText);

            // Interface shift to processing state
            document.getElementById('input-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Backend structural processing error occurred.');

                payloadData = await response.json();
                
                // Route viewport to dashboard view
                document.getElementById('loading-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                switchTab('experiences');

            } catch (err) {
                alert(`Pipeline Execution Error: ${err.message}`);
                resetToInput();
            }
        });

        function switchTab(tabId) {
            activeTab = tabId;
            document.getElementById('active-tab-title').innerText = config.find(c => c.id === tabId).title;
            renderMenu();
            renderContent();
        }

        function renderMenu() {
            const menuContainer = document.getElementById('tab-menu');
            menuContainer.innerHTML = config.map(tab => {
                const isActive = tab.id === activeTab;
                return `
                    <button onclick="switchTab('${tab.id}')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 group ${
                        isActive ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 font-semibold' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                    }">
                        <i data-lucide="${tab.icon}" class="w-5 h-5 ${isActive ? 'text-white' : 'text-slate-400 group-hover:text-slate-300'}"></i>
                        <span>${tab.title}</span>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderContent() {
            const viewport = document.getElementById('content-viewport');
            if (!payloadData) return;

            // Helper function to safely unpack strings or stringified objects
            function safeText(value) {
                if (!value) return "";
                if (typeof value === 'object') {
                    return Object.entries(value).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' | ');
                }
                return value;
            }

            // Upgraded helper function that splits text into structured bullet points when multiple links exist
            function formatTextWithBulletLinks(text) {
                const cleanedText = safeText(text);
                
                // Regex to find Markdown links [Text](URL) or raw HTTP/HTTPS URLs
                const urlRegex = /(https?:\/\/[^\s)]+)/g;
                const links = cleanedText.match(urlRegex);

                // If there are no links or just one link, return normal text parsing
                if (!links || links.length <= 1) {
                    return cleanedText.replace(urlRegex, function(url) {
                        let cleanUrl = url.replace(/[.,;:]$/, '');
                        return `<a href="${cleanUrl}" target="_blank" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-4 font-medium transition-colors">${cleanUrl}</a>`;
                    });
                }

                // If there are multiple links, clean up the text and build a clean vertical bulleted list
                // Step 1: Strip out generic filler phrases that the LLM generates when bridging links
                let introductoryText = cleanedText;
                links.forEach(url => {
                    introductoryText = introductoryText.replace(url, '||SPLIT||');
                });

                // Step 2: Clean up remnants of descriptions left behind between the splits
                let pieces = introductoryText.split('||SPLIT||');
                
                let htmlOutput = `<div class="space-y-2">`;
                
                // Step 3: Loop through and rebuild them as beautiful dashboard list items
                links.forEach((url, index) => {
                    let cleanUrl = url.replace(/[.,;:]$/, '');
                    let label = pieces[index] ? pieces[index].replace(/^[,\s:|•\-]+|[,\s:|•\-]+$/g, '').trim() : "Resource Link";
                    
                    if (!label || label.toLowerCase().includes("check out") || label.toLowerCase().includes("refer to")) {
                        label = "Official Platform Resource";
                    }

                    htmlOutput += `
                        <div class="flex items-start gap-2.5 group/link pl-1">
                            <span class="text-indigo-500 font-bold mt-1.5 text-xs select-none">•</span>
                            <div class="text-sm">
                                <span class="text-slate-400 font-medium">${label}:</span>
                                <a href="${cleanUrl}" target="_blank" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-4 font-semibold break-all transition-colors ml-1 inline-flex items-center gap-0.5">
                                    ${cleanUrl}
                                    <i data-lucide="external-link" class="w-3 h-3 inline opacity-60 group-hover/link:opacity-100 transition-opacity"></i>
                                </a>
                            </div>
                        </div>`;
                });

                htmlOutput += `</div>`;
                return htmlOutput;
            }

            if (activeTab === 'experiences') {
                const experiences = payloadData.interview_experiences || [];
                if (experiences.length === 0) {
                    viewport.innerHTML = `
                        <div class="p-6 bg-slate-900/50 border border-slate-800 rounded-2xl text-center max-w-4xl">
                            <i data-lucide="search-code" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
                            <p class="text-slate-400 text-sm">No live forum logs found for this niche role. Focus on core parameters in the remaining tech-stack windows!</p>
                        </div>`;
                } else {
                    viewport.innerHTML = `<div class="grid gap-4 max-w-4xl">${experiences.map(item => `
                        <div class="p-6 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col gap-4 hover:border-slate-700/60 transition-all shadow-md">
                            <p class="text-slate-200 text-base leading-relaxed">"${safeText(item.question_or_experience)}"</p>
                            <div>
                                <a href="${item.source_url || 'https://reddit.com'}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-400 bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 hover:bg-indigo-500/20 transition-all">
                                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Verify Source
                                </a>
                            </div>
                        </div>
                    `).join('')}</div>`;
                }
            } 
            
            else if (activeTab === 'techstack') {
                const stack = payloadData.required_tech_stack || [];
                viewport.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl">${stack.map(tech => `
                    <div class="p-5 bg-slate-900 border border-slate-800 rounded-xl flex items-center gap-4">
                        <div class="h-10 w-10 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center"><i data-lucide="cpu" class="w-5 h-5"></i></div>
                        <span class="text-slate-100 font-semibold">${safeText(tech)}</span>
                    </div>
                `).join('')}</div>`;
            } 
            
            else if (activeTab === 'resources') {
                const resources = payloadData.learning_resources || {};
                viewport.innerHTML = `<div class="grid gap-4 max-w-4xl">${Object.entries(resources).map(([tech, desc]) => `
                    <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl shadow-sm">
                        <h4 class="text-indigo-400 font-semibold text-lg mb-3 tracking-wide border-b border-slate-800 pb-1.5">${tech}</h4>
                        <!-- Uses the new multi-bullet line splitting engine -->
                        <div class="text-slate-300 text-sm leading-relaxed">${formatTextWithBulletLinks(desc)}</div>
                    </div>
                `).join('')}</div>`;
            } 
            
            else if (activeTab === 'timetable') {
                const timetable = payloadData.preparation_timetable || {};
                viewport.innerHTML = `<div class="relative border-l border-slate-800 ml-4 space-y-6 max-w-3xl">${Object.entries(timetable).map(([milestone, target]) => `
                    <div class="relative pl-8 group">
                        <div class="absolute -left-2.5 top-1.5 bg-slate-950 border-2 border-indigo-500 rounded-full w-5 h-5"></div>
                        <div class="p-6 bg-slate-900/50 border border-slate-800/60 rounded-2xl">
                            <h4 class="text-white font-bold text-md mb-2">${milestone}</h4>
                            <!-- Applied to timetable text items as well in case timelines contain multiple study guide urls -->
                            <div class="text-slate-400 text-sm leading-relaxed">${formatTextWithBulletLinks(target)}</div>
                        </div>
                    </div>
                `).join('')}</div>`;
            }
            lucide.createIcons();
        }

        function resetToInput() {
            payloadData = null;
            document.getElementById('pipeline-form').reset();
            document.getElementById('file-label-text').innerText = "Click to choose or drop your resume PDF";
            document.getElementById('file-label-text').classList.remove('text-indigo-400');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('input-view').classList.remove('hidden');
        }

        lucide.createIcons();
    </script>
</body>
</html>
